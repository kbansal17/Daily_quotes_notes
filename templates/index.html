<!DOCTYPE html>
<html>
<head>
  <title>Daily Quote + Notes</title>
  <style>
    body {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
    }
    .quote-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      font-size: 20px;
      margin-bottom: 30px;
      animation: fadeIn 1s ease-in-out;
    }
    textarea {
      width: 300px;
      height: 100px;
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
    }
    a {
      display: block;
      margin-top: 20px;
      color: white;
      text-decoration: underline;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <h2>🌟 Daily Quote</h2>
  <div class="quote-box">{{ quote }}</div>

  <form method="POST" action="/save">
    <textarea name="note" placeholder="Write your note here..."></textarea><br>
    <button type="submit">Save Note</button>
  </form>

  <a href="/notes">View All Notes →</a>
</body>
</html>
